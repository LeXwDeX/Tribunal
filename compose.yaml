# Docker Compose deployment. Copy .env.example to .env, fill in the required
# values, build the image with `docker compose build`, then run
# `docker compose up -d`. Compose loads .env implicitly for interpolation; the
# environment block below is an explicit allowlist, not an env_file.
# The project and volume names intentionally keep the crc-review identity so
# existing deployments keep their data; the image and CLI use the new name.
name: crc-review

services:
  review:
    image: tribunal:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      # TRIBUNAL_HTTP_PORT only maps the host port; the server listens on 8080.
      - "127.0.0.1:${TRIBUNAL_HTTP_PORT:-${CRC_HTTP_PORT:-8080}}:8080"
    volumes:
      - data:/app/data
      - type: bind
        source: ./config/server.docker.yaml
        target: /app/config/server.yaml
        read_only: true
        bind:
          create_host_path: false
    environment:
      TRIBUNAL_PUBLIC_URL: "${TRIBUNAL_PUBLIC_URL:-${CRC_PUBLIC_URL:-http://localhost:8080}}"
      # Raw legacy names stay visible to the server for deprecation notices.
      CRC_PUBLIC_URL: "${CRC_PUBLIC_URL:-}"
      GITLAB_URL: "${GITLAB_URL:?GITLAB_URL is required}"
      REVIEW_MASTER_KEY: "${REVIEW_MASTER_KEY:?REVIEW_MASTER_KEY is required}"
      REVIEW_ADMIN_TOKEN: "${REVIEW_ADMIN_TOKEN:?REVIEW_ADMIN_TOKEN is required}"
      # Fail closed when neither session-key name is configured.
      TRIBUNAL_SESSION_KEY: "${TRIBUNAL_SESSION_KEY:-${CRC_SESSION_KEY:?TRIBUNAL_SESSION_KEY or CRC_SESSION_KEY is required}}"
      CRC_SESSION_KEY: "${CRC_SESSION_KEY:-}"
      CRC_HTTP_PORT: "${CRC_HTTP_PORT:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:?LLM_BASE_URL is required}"
      LLM_MODEL: "${LLM_MODEL:?LLM_MODEL is required}"
      LLM_API_KEY: "${LLM_API_KEY:?LLM_API_KEY is required}"
      LLM_PROTOCOL: "${LLM_PROTOCOL:-openai-chat}"
      # Optional second provider. Empty defaults keep primary-only deployments
      # unchanged; the secondary block stays commented in server.docker.yaml.
      LLM_SECONDARY_PROTOCOL: "${LLM_SECONDARY_PROTOCOL:-}"
      LLM_SECONDARY_BASE_URL: "${LLM_SECONDARY_BASE_URL:-}"
      LLM_SECONDARY_MODEL: "${LLM_SECONDARY_MODEL:-}"
      LLM_SECONDARY_API_KEY: "${LLM_SECONDARY_API_KEY:-}"
      GITLAB_OAUTH_CLIENT_ID: "${GITLAB_OAUTH_CLIENT_ID:-}"
      GITLAB_OAUTH_CLIENT_SECRET: "${GITLAB_OAUTH_CLIENT_SECRET:-}"
      GITLAB_ADMIN_USERNAME: "${GITLAB_ADMIN_USERNAME:-}"
    command: ["--config", "/app/config/server.yaml"]

volumes:
  data:
