name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      self_hosted:
        description: Run on a self-hosted runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.self_hosted && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-latest' }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check C toolchain
        run: |
          if command -v gcc >/dev/null 2>&1; then
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo -n apt-get update
            sudo -n apt-get install -y gcc
            exit 0
          fi
          echo "::error::gcc is required by -race (cgo) but is missing and passwordless sudo is unavailable; install build-essential on this runner"
          exit 1
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Test with coverage
        run: go test -race -timeout=40m -coverprofile=coverage.out ./...
      - name: Check coverage
        run: go run ./scripts/coveragecheck -profile coverage.out -min 70
      - name: Download modules
        run: go mod download
      - name: Verify modules
        run: go mod verify
      - name: Check licenses
        run: go run ./scripts/licensecheck -min 1

  docker:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.self_hosted && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose smoke
        timeout-minutes: 20
        run: bash scripts/docker-smoke.sh

  web:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.self_hosted && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check license bundle
        working-directory: ${{ github.workspace }}
        run: go run ./scripts/licensebundle -check
      - name: Build
        run: npm run build
      - name: Check committed web build
        run: |
          status=$(git status --porcelain --untracked-files=all -- dist)
          if [ -n "$status" ]; then
            echo "::error::web/dist differs from the committed build; run npm run build and commit the result"
            echo "$status"
            exit 1
          fi
      - name: Test with coverage
        run: npm test -- --coverage
