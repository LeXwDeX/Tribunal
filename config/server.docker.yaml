# Container overrides for Docker Compose. Compose mounts this file read-only
# at /app/config/server.yaml; the server still loads its built-in defaults, so
# only values that differ from them are listed here. ${NAME} values are
# expanded by the server from the container environment supplied by Compose.
server:
  listen: ":8080"
  # Config lookup also accepts the legacy CRC_PUBLIC_URL for old persisted
  # YAML, preferring a non-empty TRIBUNAL_PUBLIC_URL.
  public_url: "${TRIBUNAL_PUBLIC_URL}"

gitlab:
  url: "${GITLAB_URL}"

auth:
  bootstrap_token_env: REVIEW_ADMIN_TOKEN
  # Optional GitLab OAuth browser login, off by default. To enable /auth/login,
  # uncomment the oauth mapping and bootstrap_admins below, then set the
  # matching variables in .env. Redirect URI: ${TRIBUNAL_PUBLIC_URL}/auth/callback;
  # scope: read_user.
  # oauth:
  #   client_id_env: GITLAB_OAUTH_CLIENT_ID
  #   client_secret_env: GITLAB_OAUTH_CLIENT_SECRET
  # Platform admins after OAuth login, as "id:<GitLab user id>" in
  # GITLAB_ADMIN_USERNAME. IDs survive
  # GitLab renames. Plain usernames are deprecated, logged at startup and
  # will be removed in the next major release.
  # bootstrap_admins: ["${GITLAB_ADMIN_USERNAME}"]

storage:
  driver: sqlite
  # Absolute paths keep both the database and checkouts on the data volume.
  dsn: "file:/app/data/review.db"

workspace:
  root: /app/data/workspaces

secrets:
  master_key_env: REVIEW_MASTER_KEY

providers:
  primary:
    # anthropic | openai-chat | openai-responses.
    # Anthropic base_url is the API root; OpenAI base_url includes /v1.
    protocol: "${LLM_PROTOCOL}"
    base_url: "${LLM_BASE_URL}"
    model: "${LLM_MODEL}"
    api_key_env: LLM_API_KEY
    max_concurrency: 4

profiles:
  onboarding:
    agent:
      provider: primary
  default:
    propose:
      - block: code-review
        provider: primary
    challenge:
      provider: primary

# Built-in platform extensions (see docs/design/06-config.md). The bundled
# code-review skill is registered on first start, refreshed on upgrades and
# mounted on the code-review and review blocks. It can be disabled in the
# console but not deleted; disabling and unbinding survive restarts, and an
# existing binding for a block is kept as is. Use `skills: []` to register no
# new defaults.
default_extensions:
  skills:
    - name: code-review
      blocks: [code-review, review]
  # Built-in code graph: codebase-memory-mcp 0.12.1 (MIT), bundled in the
  # Docker image. Its config follows the release on every start and it can be
  # disabled but not deleted. The wrapper keeps HOME, cache and runtime inside
  # each project workspace and turns off auto-indexing, the file watcher and
  # the graph UI; the analysis profile exposes read-only tools only.
  # index_repository, delete_project, ingest_traces and manage_adr are never
  # granted to a block.
  mcp_servers:
    - name: codebase-memory
      config:
        command: /usr/local/bin/tribunal-codebase-memory-mcp
        args: ["--tool-profile=analysis"]
        x-review:
          # Onboarding and refresh index the fixed base/ checkout via the CLI.
          index_command:
            - /usr/local/bin/tribunal-codebase-memory-mcp
            - cli
            - --quiet
            - index_repository
            - '{"repo_path":"{base_dir}"}'
          env_allowlist: ["PATH"]
          home: .mcp/codebase-memory/home
          call_timeout: 60s
          max_output_chars: 20000
          idle_timeout: 10m
      tools:
        code-review: &codebase_memory_read_tools
          - list_projects
          - index_status
          - search_graph
          - trace_path
          - get_code_snippet
          - query_graph
          - get_graph_schema
          - get_file_outline
          - get_architecture
          - search_code
          - check_index_coverage
        review: *codebase_memory_read_tools
        verify: [get_code_snippet]
