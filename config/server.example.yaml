# Minimal M0 configuration.
# 1. Replace gitlab.url with your GitLab base URL.
# 2. Generate REVIEW_MASTER_KEY and REVIEW_ADMIN_TOKEN without printing them,
#    as described in docs/agent-deployment.md#2-准备配置, then inject them
#    through the environment. Never write the values into this file.
server:
  listen: ":8080"
  public_url: "http://localhost:8080"
  read_timeout: 15s
  write_timeout: 60s

gitlab:
  url: "https://gitlab.example.internal"
  request_timeout: 30s
  max_concurrency: 16
  # One-time scan after startup recovery: open MR heads that never got a review
  # (for example a webhook delivered while the service was down) are enqueued
  # once with trigger catch_up, through the normal webhook filters. Read at
  # startup only; changing it needs a restart.
  catch_up:
    enabled: true
    max_per_project: 10             # reviews enqueued per project per scan
    max_total: 20                   # reviews enqueued across all projects per scan
    max_age: 24h                    # only MRs updated within this window

auth:
  # Optional GitLab OAuth application for browser login. Add the oauth mapping
  # and export both variables; with oauth absent, /auth/login returns 503 and
  # Bearer authentication keeps working.
  # GitLab redirect URI: https://review.example.internal/auth/callback
  # GitLab scope: read_user
  # oauth:
  #   client_id_env: GITLAB_OAUTH_CLIENT_ID
  #   client_secret_env: GITLAB_OAUTH_CLIENT_SECRET
  bootstrap_token_env: REVIEW_ADMIN_TOKEN
  # Platform admins after OAuth login, as "id:<GitLab user id>". IDs survive
  # GitLab renames. Only add an ID after the user confirms the actual numeric
  # ID and authorizes access. Plain usernames are deprecated, logged at startup
  # and will be removed in the next major release.
  # bootstrap_admins: []
  session_ttl: 168h

storage:
  driver: sqlite
  dsn: "file:data/review.db"
  llm_call_retention: 720h
  delivery_retention: 336h
  job_retention: 168h
  context_versions: 5

secrets:
  master_key_env: REVIEW_MASTER_KEY

workspace:
  root: "data/workspaces"
  git_bin: "git"
  context_refresh:
    changed_files: 200
    max_age: 168h
  run_cleanup_after: 1h

jobs:
  workers: 4
  lease: 5m

engine:
  max_concurrent_nodes: 8
  default_node_timeout: 10m

# Optional LLM outbound CIDRs. Explicit denies take priority over allows.
# Link-local, unspecified, multicast and limited broadcast addresses are
# denied by default; private and loopback addresses are allowed.
# llm:
#   egress:
#     deny_cidrs: []
#     allow_cidrs: []

# Optional DeepSeek maximum-capability examples, verified 2026-11-11 against
# https://api-docs.deepseek.com/quick_start/pricing. DeepSeek-only: do not copy
# these values to another provider. Uncomment one provider and point
# profiles.default (or a lane) at it. An existing user model can receive the
# same parameters from the shipped presets (GET /api/v1/model-presets).
# providers:
#   deepseek-v4-pro:
#     protocol: openai-chat
#     base_url: "https://api.deepseek.com"
#     model: "deepseek-v4-pro"
#     api_key_env: DEEPSEEK_API_KEY
#     max_concurrency: 500             # documented account ceiling, not a local target
#     max_tokens: 393216               # documented maximum output; omitting it is not maximum
#     context_window: 655360           # 1,048,576 context minus the 393,216 output reserve
#     reasoning: { effort: max }       # low | high | max; the upstream default is high
#     forced_tool_choice: unsupported  # thinking + tools rejects a forced tool choice
#     preserve_reasoning_content: true # required when thinking and tools are combined
#     # rpm: 0 leaves local rate limiting off; the upstream account limit applies.
#   deepseek-flash:
#     protocol: openai-chat
#     base_url: "https://api.deepseek.com"
#     model: "deepseek-flash"
#     api_key_env: DEEPSEEK_API_KEY
#     max_concurrency: 2500
#     max_tokens: 393216
#     context_window: 655360
#     reasoning: { effort: max }
#     forced_tool_choice: unsupported
#     preserve_reasoning_content: true

profiles:
  # The only review profile: explore, then code-review (with the code-review
  # skill), review, reasoner and validate in parallel, then adjudication and
  # the report. provider is the default model of every node; explore, lanes.*
  # and challenge (the per-finding refutation) can name another provider.
  default:
    # Name a provider defined under providers, for example primary.
    # provider: primary
    # explore: { provider: primary }
    # lanes:
    #   code_review: { provider: primary }
    #   review: { provider: primary }
    #   reasoner: { provider: primary }
    #   validate: { provider: primary }
    # challenge: { provider: primary }
    plan: { package_tokens: 60000 }
    # max_tokens: 0 (default) sets no workflow token cap; the upstream key quota
    # limits usage. Set a positive value only to cap tokens per review.
    budget: { max_nodes: 30, deadline: 30m, max_tokens: 0 }

review_defaults:
  language: zh-CN
  skip_draft: true

# Built-in platform extensions (see docs/design/06-config.md). The bundled
# code-review skill is registered on first start, refreshed on upgrades and
# mounted only on the code-review block. It can be disabled in the console but
# not deleted; disabling and administrator changes survive restarts. Bindings
# still managed by defaults follow upgrades. Use `skills: []` to register no
# new defaults.
default_extensions:
  skills:
    - name: code-review
      blocks: [code-review]
  # Built-in code graph: codebase-memory-mcp 0.12.1 (MIT), bundled in the
  # Docker image. Its config follows the release on every start and it can be
  # disabled but not deleted. The wrapper keeps HOME, cache and runtime inside
  # each project workspace and turns off auto-indexing, the file watcher and
  # the graph UI; the analysis profile exposes read-only tools only.
  # index_repository, delete_project, ingest_traces and manage_adr are never
  # granted to a block.
  mcp_servers:
    - name: codebase-memory
      config:
        command: /usr/local/bin/tribunal-codebase-memory-mcp
        args: ["--tool-profile=analysis"]
        x-review:
          # Onboarding and refresh index the fixed base/ checkout via the CLI.
          index_command:
            - /usr/local/bin/tribunal-codebase-memory-mcp
            - cli
            - --quiet
            - index_repository
            - '{"repo_path":"{base_dir}"}'
          env_allowlist: ["PATH"]
          home: .mcp/codebase-memory/home
          call_timeout: 60s
          max_output_chars: 20000
          idle_timeout: 10m
      tools:
        code-review: &codebase_memory_read_tools
          - list_projects
          - index_status
          - search_graph
          - trace_path
          - get_code_snippet
          - query_graph
          - get_graph_schema
          - get_file_outline
          - get_architecture
          - search_code
          - check_index_coverage
        review: *codebase_memory_read_tools
        explore: *codebase_memory_read_tools
        validate: &codebase_memory_verify_tools [get_code_snippet, search_graph, trace_path, search_code]
        verify: *codebase_memory_verify_tools
        onboarding: [get_architecture, get_graph_schema]
